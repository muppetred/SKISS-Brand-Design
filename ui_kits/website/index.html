<!-- @startingPoint section="Site web" subtitle="Site SKISS complet et interactif : accueil, nous, contact" viewport="1280x800" -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SKISS</title>
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="site.css" />
</head>
<body class="theme-dark">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script>
  // Le nom exact de l'espace de noms est fixé par Claude Design au moment de la compilation : on le cherche, une seule fois.
  window.SKDS = window[Object.keys(window).find((k) => /DesignSystem_/.test(k))];
</script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="react" src="Commun.jsx"></script>
<script type="text/babel" data-presets="react" src="Nav.jsx"></script>
<script type="text/babel" data-presets="react" src="Hero.jsx"></script>
<script type="text/babel" data-presets="react" src="Services.jsx"></script>
<script type="text/babel" data-presets="react" src="Realisations.jsx"></script>
<script type="text/babel" data-presets="react" src="Equipe.jsx"></script>
<script type="text/babel" data-presets="react" src="Contact.jsx"></script>
<script type="text/babel" data-presets="react" src="Footer.jsx"></script>
<script type="text/babel" data-presets="react" src="Pages.jsx"></script>
<script type="text/babel" data-presets="react">
  // Navigation interactive entre l'accueil, la page Nous et la page Contact.
  // Le site défile dans .sk-site (la page elle-même ne défile pas) ; l'adresse garde la page courante (#nous, #contact).
  function SiteApp() {
    const { ThemeSection } = window.SKDS;
    const pages = { accueil: PageAccueil, nous: PageNous, contact: PageContact };
    const depart = (location.hash || "").slice(1);
    const [page, setPage] = React.useState(pages[depart] ? depart : "accueil");
    const [cible, setCible] = React.useState(null);
    const [scrolled, setScrolled] = React.useState(false);
    const pagePrecedente = React.useRef(page);

    React.useEffect(() => {
      const el = document.getElementById("sk-scroll");
      const onScroll = () => setScrolled(el.scrollTop > 50);
      el.addEventListener("scroll", onScroll, { passive: true });
      return () => el.removeEventListener("scroll", onScroll);
    }, []);

    React.useEffect(() => {
      if (!cible) return;
      const el = document.getElementById("sk-scroll");
      const memePage = pagePrecedente.current === cible.page;
      pagePrecedente.current = cible.page;
      const t = cible.ancre ? document.getElementById(cible.ancre) : null;
      const top = t ? t.getBoundingClientRect().top - el.getBoundingClientRect().top + el.scrollTop - 72 : 0;
      el.scrollTo({ top, behavior: memePage ? "smooth" : "auto" });
    }, [cible]);

    const naviguer = (p, ancre) => {
      setPage(p);
      setCible({ page: p, ancre, n: Date.now() });
      try { history.replaceState(null, "", `#${p}`); } catch (e) { /* aperçu sans historique */ }
    };

    const Page = pages[page];
    return (
      <ThemeSection as="div" theme="dark" id="sk-scroll" className="sk-site">
        <SiteNav page={page} scrolled={scrolled} onNavigate={naviguer} />
        <main key={page}><Page onNavigate={naviguer} /></main>
        <SiteFooter onNavigate={naviguer} />
      </ThemeSection>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<SiteApp />);
</script>
</body>
</html>
