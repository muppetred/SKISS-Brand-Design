<!-- @dsCard group="Marque" viewport="700x490" name="Logo sur fond sombre" subtitle="Les cinq versions en blanc, sur la variante sombre" -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--dark-900); color: var(--dark-text); font-family: var(--font-sans); font-size: 11.5px; line-height: 1.3; }
  .card { width: 700px; padding: 16px 24px 18px;  }
  .head { font-weight: var(--fw-bold); font-size: 10.5px; letter-spacing: var(--tracking-label); text-transform: uppercase; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: 250px 1fr; gap: 28px; }
  .cell { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .lb { font-size: 11px; background: transparent; padding: 0; border-radius: var(--radius-pill); }
  .lb b { font-size: 11.5px; }
  .lb span { color: var(--dark-muted); }
  .row { display: flex; gap: 22px; align-items: flex-end; margin-top: 16px; }
  .sig { display: flex; align-items: center; gap: 5.6px; }
  .sig .sp { height: 38.5px; } .sig .wm { height: 31.5px; }
</style>
</head>
<body>
<div class="card">
  <div class="head"><span class="lb">Fond sombre #12100C&nbsp;: logo blanc</span></div>
  <div class="grid">
    <div class="cell">
      <img src="../assets/logos/logo-vertical-white.png" alt="SKISS, logo complet vertical" style="width:250px;height:auto">
      <div class="lb"><b>Logo complet vertical</b><br><span>230&nbsp;px de large au moins</span></div>
    </div>
    <div>
      <div class="cell">
        <img src="../assets/logos/logo-horizontal-white.png" alt="SKISS, logo complet horizontal" style="width:338px;height:auto">
        <div class="lb"><b>Logo complet horizontal</b><br><span>325&nbsp;px de large au moins</span></div>
      </div>
      <div class="row">
        <div class="cell"><img src="../assets/logos/bulb-white.svg" alt="Ampoule SKISS" style="height:158px;width:auto"><div class="lb"><b>Ampoule</b><br><span>155&nbsp;px de haut au moins</span></div></div>
        <div class="cell"><img src="../assets/logos/spiral-white.png" alt="Spirale SKISS" style="height:84px;width:auto"><div class="lb"><b>Spirale</b><br><span>350&nbsp;px au plus</span></div></div>
        <div class="cell"><div class="sig"><img class="sp" src="../assets/logos/spiral-white.png" alt=""><img class="wm" src="../assets/logos/wordmark-white.png" alt="SKISS"></div><div class="lb"><b>Signature</b><br><span>spirale + wordmark</span></div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
