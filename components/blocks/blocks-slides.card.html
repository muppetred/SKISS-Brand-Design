<!-- @dsCard group="Blocs éditoriaux" viewport="1536x954" name="Capsules, cartes numérotées, citation" subtitle="Slides 1920 x 1080 sur le dégradé deck, réduites à 38 %" -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--white); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(2, 729.6px); gap: 20px; padding: 28px; }
  .tile { display: flex; flex-direction: column; gap: 8px; }
  .label { font-size: 14px; line-height: 20px; color: var(--ink-o72); }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel">
    // Le nom exact de l'espace de noms est fixé par Claude Design au moment de la compilation : on le cherche.
    const DS = window[Object.keys(window).find((k) => /DesignSystem_/.test(k))];
    const { SlideFrame, Capsule, NumberedCard, Quote, SectionTitle } = DS;

    const S = 0.38;
    const Tile = ({ label, children }) => <div className="tile">{children}<div className="label">{label}</div></div>;
    const steps = [
      { number: 1, label: "Audit", icon: "search" },
      { number: 2, label: "Cadrage", icon: "compass" },
      { number: 3, label: "Set-up", icon: "wrench" },
      { number: 4, label: "Pilotage", icon: "trending-up" },
    ];

    function Board() {
      return (
        <div className="grid">
          <Tile label="Capsule · blanc à 62 %, texte encre">
            <SlideFrame scale={S} title="Un compte publicitaire se pilote dans cet ordre">
              <div style={{ display: "flex", flexDirection: "column", gap: 56 }}>
                <Capsule>On regarde ce qui existe</Capsule>
                <Capsule>On construit ce qui manque</Capsule>
                <Capsule>On pilote dans la durée</Capsule>
              </div>
            </SlideFrame>
          </Tile>
          <Tile label="NumberedCard · quatre nuances, du brûlé au pêche">
            <SlideFrame scale={S}>
              <div style={{ flex: "1 1 auto", display: "flex", justifyContent: "space-between" }}>
                {steps.map((s) => <div key={s.number} style={{ width: 334 }}><NumberedCard {...s} /></div>)}
              </div>
            </SlideFrame>
          </Tile>
          <Tile label="Quote · spirale, guillemets, Khand 108 px">
            <SlideFrame scale={S}>
              <Quote author="Martin Elegeert · SKISS">L’IA comme méthode, pas comme gadget.</Quote>
            </SlideFrame>
          </Tile>
          <Tile label="SectionTitle · blanc sur voile encre à 41 %">
            <SlideFrame scale={S}><SectionTitle tone="white">Stratégie</SectionTitle></SlideFrame>
          </Tile>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Board />);
  </script>
</body>
</html>
