<!-- @dsCard group="Blocs éditoriaux" viewport="1480x724" name="Cadres Instagram" subtitle="Post 1080 x 1350 et reel 1080 x 1920, dégradé social et formes en S" -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--white); font-family: var(--font-sans); }
  .row { display: flex; gap: 20px; padding: 28px; }
  .tile { display: flex; flex-direction: column; gap: 8px; }
  .outlined { box-shadow: 0 0 0 1px var(--ink-o14); }
  .label { font-size: 14px; line-height: 20px; color: var(--ink-o72); }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel">
    // Le nom exact de l'espace de noms est fixé par Claude Design au moment de la compilation : on le cherche.
    const DS = window[Object.keys(window).find((k) => /DesignSystem_/.test(k))];
    const { PostFrame } = DS;

    const Tile = ({ label, children, outlined }) => (
      <div className="tile"><div className={outlined ? "outlined" : ""}>{children}</div><div className="label">{label}</div></div>
    );
    const title = { margin: 0, fontFamily: "var(--font-display)", fontWeight: "var(--fw-bold)", fontSize: "var(--post-title)", lineHeight: "var(--leading-tight)" };
    const body = { margin: 0, fontFamily: "var(--font-sans)", fontSize: "var(--post-body)", lineHeight: "var(--leading-deck)" };

    function Board() {
      return (
        <div className="row">
          <Tile label="Post · thème social, signature noire">
            <PostFrame scale={640 / 1350}><h2 style={title}>Rien ne se lance sans tracking.</h2></PostFrame>
          </Tile>
          <Tile label="Post · thème clair, page intérieure" outlined>
            <PostFrame theme="light" scale={640 / 1350}>
              <div style={{ flex: "1 1 auto", display: "flex", flexDirection: "column" }}>
                <div style={{ alignSelf: "flex-end", fontFamily: "var(--font-display)", fontSize: 260, lineHeight: 0.9, color: "var(--orange-burnt)" }}>02</div>
                <p style={{ ...body, marginTop: "auto" }}>Pas de campagne tant que le pixel, GA4 et le consentement ne sont pas validés.</p>
              </div>
            </PostFrame>
          </Tile>
          <Tile label="Reel · zone sûre 14 % en haut, 35 % en bas">
            <PostFrame format="reel" scale={640 / 1920}>
              <h2 style={title}>Aftermovie</h2>
              <p style={{ ...body, marginTop: 16 }}>Wilmeyer · tournoi de padel 2024</p>
            </PostFrame>
          </Tile>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Board />);
  </script>
</body>
</html>
