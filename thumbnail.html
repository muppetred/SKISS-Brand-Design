<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="styles.css" />
<style>
  body { margin: 0; width: 1280px; height: 854px; display: flex; }
  .main { width: 75%; height: 100%; background: var(--gradient-deck); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .main::before { content: ""; position: absolute; width: 826px; height: 826px; border-radius: 50%; background: var(--cover-circle); left: -558px; top: -326px; }
  .main img { position: relative; height: 62%; width: auto; }
  .strip { width: 25%; height: 100%; display: flex; flex-direction: column; }
  .strip div { flex: 1; }
</style>
</head>
<body>
  <div class="main"><img src="assets/logos/logo-vertical-white.png" alt="SKISS" /></div>
  <div class="strip">
    <div style="background:var(--orange-burnt)"></div>
    <div style="background:var(--orange-deep)"></div>
    <div style="background:var(--orange-light)"></div>
    <div style="background:var(--peach)"></div>
    <div style="background:var(--ink)"></div>
  </div>
</body>
</html>
